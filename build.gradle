plugins {
	id 'java'
	id 'org.springframework.boot' version '3.5.6'
	id 'io.spring.dependency-management' version '1.1.7'
}

java {
    
}
group = 'com.pingAssignment'
version = '0.0.1-SNAPSHOT'
description = 'Scalable File Processor'

configurations {
    mockitoAgent
    compileOnly {
        extendsFrom annotationProcessor
    }

}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	compileOnly 'org.projectlombok:lombok'
	runtimeOnly 'org.postgresql:postgresql'
    runtimeOnly 'com.h2database:h2'         // H2 added for app runtime
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.boot:spring-boot-testcontainers'
	testImplementation 'org.testcontainers:junit-jupiter'
	testImplementation 'org.testcontainers:postgresql'
    testImplementation 'org.mockito:mockito-core' // for test code
    mockitoAgent('org.mockito:mockito-core') {
        transitive = false
    }
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
    def mockitoAgent = configurations.mockitoAgent.singleFile
    jvmArgs "-javaagent:${mockitoAgent}"
}
