spring.application.name=scalablefileprocessor
# Use H2 in-memory database
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.sql.init.mode=always

# JPA/Hibernate settings
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true

# Enable H2 Console (optional, for debugging)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console


# Custom application properties for file processing service

# Number of user records to batch before saving to the database.
fileprocessor.batchSize=100

# Maximum number of threads to process files concurrently (must match executor config).
fileprocessor.maxThreads=4

# Maximum number of files processed per minute to throttle processing rate.
fileprocessor.maxFilesPerMinute=10