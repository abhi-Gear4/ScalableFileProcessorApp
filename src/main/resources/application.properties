spring.application.name=scalablefileprocessor

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true


# Custom application properties for file processing service

# Number of user records to batch before saving to the database.
fileprocessor.batchSize=10

# Maximum number of threads to process files concurrently (must match executor config).
fileprocessor.maxThreads=4

# Maximum number of files processed per minute to throttle processing rate.
fileprocessor.maxFilesPerMinute=40